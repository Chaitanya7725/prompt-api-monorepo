services:
  postgres:
    image: postgres:16
    container_name: agentic-sdlc-postgres
    environment:
      POSTGRES_DB: agentic_sdlc
      POSTGRES_USER: agentic_user
      POSTGRES_PASSWORD: agentic_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: